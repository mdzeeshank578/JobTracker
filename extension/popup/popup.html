<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobTracker Sync Settings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    body {
      width: 320px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      box-sizing: border-box;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 9999px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge.connected {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge.disconnected {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      box-sizing: border-box;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .history-section {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .history-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .history-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      font-size: 11px;
      padding: 6px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-company {
      font-weight: 600;
      color: var(--text-main);
    }

    .history-role {
      color: var(--text-muted);
    }

    .history-status {
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      font-size: 9px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h3>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    JobTracker Sync
  </h3>
  <p>Track job applications from any website with one click.</p>

  <div id="status-badge" class="badge disconnected">Disconnected</div>

  <div class="form-group">
    <label for="token-input">Connection Token</label>
    <input type="password" id="token-input" placeholder="Paste user uid or connection token">
  </div>

  <div class="form-group">
    <label for="backend-input">Backend URL</label>
    <input type="text" id="backend-input" value="http://localhost:5001">
  </div>

  <button id="save-btn" class="btn">Connect Account</button>

  <div class="history-section" id="history-section" style="display: none;">
    <div class="history-title">Recently Synced Jobs</div>
    <ul class="history-list" id="history-list">
      <!-- Synced list dynamically rendered -->
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
